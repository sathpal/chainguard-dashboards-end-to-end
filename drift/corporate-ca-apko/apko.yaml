# The same corporate root CA as corporate-ca-dockerfile, added the way the trust-anchor rule expects: declared in the
# image's build definition. apko merges it into every CA bundle and Java truststore and only then writes the SHA-256
# sidecars, so the image stays self-consistent and SV-263659 passes. The reviewed build definition is the approval;
# the sidecar is the evidence. (For Chainguard images in your organization, Custom Assembly is the managed equivalent.)
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-base
certificates:
  additional:
    - name: example-corp-root
